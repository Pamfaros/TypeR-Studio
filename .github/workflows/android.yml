name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "mobile/**"
      - "web/**"
      - "desktop/scripts/site-files.js"
      - "scripts/test-nemesis.mjs"
      - "scripts/test-hugging-face.mjs"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: mobile
      - run: node --test scripts/test-nemesis.mjs scripts/test-hugging-face.mjs
      - run: npm run android:apk
        working-directory: mobile
      - name: Verify debug APK
        run: |
          apk=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          model=web/models/nemesis-manhwa.onnx
          unzip -p "$apk" "assets/public/$model" | cmp - "$model"
          for file in ort.wasm.min.js ort-wasm-simd-threaded.js ort-wasm-simd-threaded.wasm; do
            unzip -t "$apk" "assets/public/web/vendor/nemesis/$file"
          done
      - name: Enable hardware acceleration for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test bundled Nemesis in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd mobile/android && sh ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: TypeR-Studio-Nemesis-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
